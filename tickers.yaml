# Tickers, owners, and Score weights.
# Weights: refit 2026-10-09 by optimize.py (full history, true ATH, trading-day steps,
# maximize mean yearly sell efficiency with "first ScoreSmooth >= 30 from Oct 1").
# See coefficients_review.md: these did not beat a fixed Dec 22 sale out of sample;
# they are used for monitoring. Previous weights (TickerWeights.txt) kept in comments.
#   price        -> Ratio_to_ATH
#   time         -> DayOfYear  (was ALPHA)
#   velocity     -> v_z
#   acceleration -> a_z
#   jerk         -> j_z

settings:
  threshold: 30        # "Target Score" line, Overview highlight, alert R1
  z_window: 60         # rolling window for z-scores (trading days)
  smooth_window: 7     # ScoreSmooth rolling mean (resets each calendar year)
  score_axis_max: 35   # year-long chart y-axis top; expands if ScoreSmooth exceeds it

